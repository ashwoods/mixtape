name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:  # release.yml publishes only what passes

permissions:
  contents: read

jobs:
  # `rs` adds the Rust plugins of gst-plugins-rs, so every test runs; `stock` has only
  # Ubuntu's packages, so the tests that need those plugins must skip, not fail.
  ubuntu:
    name: Ubuntu 24.04 (${{ matrix.plugins }})
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        plugins: [rs, stock]
    steps:
      - uses: actions/checkout@v5

      # gi and GStreamer come from apt, as in the Dockerfile. The docs' examples need bad
      # (webrtcbin, inter, proxy, unixfd), ugly (x264enc) and nice (webrtcbin's ICE).
      # scripts/apt-install moves to the next mirror when one is slow.
      - name: Install GStreamer
        timeout-minutes: 15
        run: |
          scripts/apt-install \
            python3-gi \
            python3-gst-1.0 \
            gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad \
            gstreamer1.0-plugins-ugly \
            gstreamer1.0-nice \
            gstreamer1.0-tools

      # The perf tracers (queue-levels, buffer-lateness, pad-push-timings) and the WebRTC
      # plugin (webrtcsink, webrtcsrc) are not packaged for Ubuntu: build them once and
      # cache the plugins.
      - name: Cache GStreamer Rust plugins
        if: matrix.plugins == 'rs'
        id: rs-plugins
        uses: actions/cache@v6
        with:
          path: ~/.cache/gst-rs-plugins
          key: gst-rs-plugins-${{ runner.os }}-0.15.4-${{ hashFiles('scripts/build-rs-plugins') }}

      # The dev packages double the download, so they come only with a build.
      - name: Build GStreamer Rust plugins
        if: matrix.plugins == 'rs' && steps.rs-plugins.outputs.cache-hit != 'true'
        timeout-minutes: 30
        run: |
          scripts/apt-install \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev \
            libgstreamer-plugins-bad1.0-dev
          rustup toolchain install stable --profile minimal
          scripts/build-rs-plugins ~/.cache/gst-rs-plugins

      - name: Put the Rust plugins on GST_PLUGIN_PATH
        if: matrix.plugins == 'rs'
        run: echo "GST_PLUGIN_PATH=$HOME/.cache/gst-rs-plugins" >> "$GITHUB_ENV"

      - name: Check the Rust plugins load
        if: matrix.plugins == 'rs'
        run: |
          gst-inspect-1.0 queue-levels
          gst-inspect-1.0 webrtcsink
          gst-inspect-1.0 webrtcsrc

      # setup-uv stopped publishing major tags at v8: pin the release.
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.13.7"

      - name: ruff, mypy, pytest
        timeout-minutes: 20
        run: scripts/check
        env:
          MIXTAPE_PYTHON: /usr/bin/python3

      - name: The wheel, installed
        timeout-minutes: 5
        run: scripts/wheel-smoke
        env:
          MIXTAPE_PYTHON: /usr/bin/python3

  # Homebrew's gstreamer has the Rust plugins, and its Python has gi.
  macos:
    name: macOS (Homebrew)
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - name: Install GStreamer
        timeout-minutes: 20
        run: |
          brew install gstreamer libnice-gstreamer
          gst-inspect-1.0 queue-levels
          gst-inspect-1.0 webrtcsink

      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.13.7"

      - name: ruff, mypy, pytest
        timeout-minutes: 20
        run: scripts/check

      - name: The wheel, installed
        timeout-minutes: 5
        run: MIXTAPE_PYTHON="$(brew --prefix)/bin/python3" scripts/wheel-smoke
