name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      # gi and GStreamer come from apt, as in the Dockerfile. The docs' examples need bad
      # (webrtcbin, inter, proxy, unixfd), ugly (x264enc) and nice (webrtcbin's ICE).
      - name: Install GStreamer
        run: |
          sudo apt-get update -yq
          sudo apt-get install -yq --no-install-recommends \
            python3-gi \
            python3-gst-1.0 \
            gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad \
            gstreamer1.0-plugins-ugly \
            gstreamer1.0-nice \
            gstreamer1.0-tools \
            libgstreamer1.0-dev

      # The perf tracers (queue-levels, buffer-lateness, pad-push-timings) are
      # not packaged for Ubuntu: build them once and cache the plugin.
      - name: Cache GStreamer Rust tracers
        id: tracers
        uses: actions/cache@v6
        with:
          path: ~/.cache/gst-rs-tracers
          key: gst-rs-tracers-${{ runner.os }}-0.15.4-${{ hashFiles('scripts/build-rs-tracers') }}

      - name: Build GStreamer Rust tracers
        if: steps.tracers.outputs.cache-hit != 'true'
        run: |
          rustup toolchain install stable --profile minimal
          scripts/build-rs-tracers ~/.cache/gst-rs-tracers

      - name: Put the tracers on GST_PLUGIN_PATH
        run: echo "GST_PLUGIN_PATH=$HOME/.cache/gst-rs-tracers" >> "$GITHUB_ENV"

      - name: Check the tracers load
        run: gst-inspect-1.0 queue-levels

      # setup-uv stopped publishing major tags at v8: pin the release.
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.13.7"

      - name: ruff, mypy, pytest
        run: scripts/check
        env:
          MIXTAPE_PYTHON: /usr/bin/python3
