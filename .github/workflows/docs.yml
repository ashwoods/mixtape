name: docs

# The site describes the release on PyPI: it is built on every push and pull request, and
# published when a release is published (or by hand, from the Actions tab).
on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

# one deployment at a time; a newer push replaces a waiting one
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # The pages' commands and snippets run in CI's pytest (tests/test_doc_samples.py); this job
  # only builds the site.
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.13.7"
      - run: uv run --locked --only-group docs mkdocs build --strict
        env:
          NO_MKDOCS_2_WARNING: "1"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  # Publishing needs Settings → Pages → Source: GitHub Actions, and the github-pages
  # environment to allow release tags (a deployment policy for tags `[0-9]*.[0-9]*.[0-9]*`).
  # The account's Pages domain serves it at https://shashi.to/mixtape/.
  deploy:
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
