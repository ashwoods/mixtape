name: Release

# Publishing a GitHub release runs CI on its tag, then builds the wheel and sdist, attests their
# provenance (`gh attestation verify <file> --repo ashwoods/mixtape`), attaches them and
# uploads them to PyPI.
on:
  release:
    types: [published]

jobs:
  # The tag's commit passes every check first.
  ci:
    uses: ./.github/workflows/ci.yml

  dist:
    needs: ci
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write  # attach the files to the release
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.13.7"
          enable-cache: false

      - name: Check the tag is the version
        run: test "$(uv version --short)" = "$GITHUB_REF_NAME"

      # No GStreamer needed: hatchling only packs the files.
      - name: Build
        run: uv build

      - uses: actions/attest@v4
        with:
          subject-path: dist/*

      - name: Attach to the release
        run: gh release upload "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  # Trusted publishing: pypi.org's mixtape project trusts this repository's release.yml in the
  # `pypi` environment, so no token is stored.
  pypi:
    needs: dist
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/mixtape/${{ github.ref_name }}/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
