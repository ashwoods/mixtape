<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>mixtape</title>
</head>
<body>
<h1>mixtape</h1>
<pre id="model">loading /api/model…</pre>
<script>
fetch("/api/model")
  .then((response) => response.json())
  .then((model) => { document.getElementById("model").textContent = JSON.stringify(model, null, 2); });
</script>
</body>
</html>
