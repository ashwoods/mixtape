[project]
name = "mixtape"
version = "0.8.0.dev0"
description = "GStreamer Python application mini-framework"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Ashley Camba Garrido", email = "ashwoods@gmail.com" }]
# PyGObject (`gi`) and GStreamer come from the system (Homebrew or apt), see README.
requires-python = ">=3.12"
dependencies = ["pydantic>=2.11"]  # serialize_by_alias
keywords = ["gstreamer", "multimedia", "pipeline", "asyncio", "player"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Framework :: AsyncIO",
    "Framework :: Pytest",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Multimedia :: Sound/Audio",
    "Topic :: Multimedia :: Video",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: Testing",
    "Typing :: Typed",
]

[project.optional-dependencies]
# No `uvicorn[standard]`: its uvloop and httptools are C extensions, and the server runs on
# asyncio next to the player anyway.
http = [
    "fastapi>=0.115",
    "uvicorn>=0.29",  # Server.capture_signals
    "websockets>=13",
]

[project.scripts]
mixtape = "mixtape.cli:main"

[project.entry-points."mixtape.features"]
leaks = "mixtape.features.leaks:Leaks"
perf = "mixtape.features.perf:Perf"
tracers = "mixtape.features.tracers:Tracers"

[project.entry-points.pytest11]
mixtape = "mixtape.pytest_plugin"

[project.urls]
Homepage = "https://github.com/ashwoods/mixtape"
Repository = "https://github.com/ashwoods/mixtape"
Issues = "https://github.com/ashwoods/mixtape/issues"
Changelog = "https://github.com/ashwoods/mixtape/blob/main/Changelog.md"

[dependency-groups]
dev = [
    "colorlog",
    "httpx",
    "mixtape[http]",
    { include-group = "docs" },
    "mypy",
    "pytest",
    "pytest-asyncio",
    "pytest-mock",
    "pytest-timeout",
    "ruff",
]

# The site in docs/ (mkdocs.yml); .github/workflows/docs.yml builds it with only this group.
docs = ["mkdocs-material==9.8.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mixtape"]

[tool.hatch.build.targets.sdist]
exclude = [".devcontainer", ".github", ".ultimate"]

[tool.uv]
required-version = ">=0.8"

[tool.pytest.ini_options]
addopts = "-ra --tb=short"
testpaths = ["tests"]
timeout = 20
timeout_method = "thread"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "B", "N"]
ignore = [
    "E402", # gi.require_version() must run before `from gi.repository import ...`
    "N818", # renaming the public exceptions is an API change
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["N803"] # the `Gst` fixture mirrors the module name

[tool.mypy]
files = ["mixtape", "tests", "examples"]
python_version = "3.12"
strict_optional = true
strict_equality = true
warn_no_return = true
warn_redundant_casts = true
warn_unused_configs = true
warn_unused_ignores = true
disallow_any_generics = true
disallow_incomplete_defs = true
disallow_subclassing_any = true
disallow_untyped_decorators = true
disallow_untyped_defs = true
check_untyped_defs = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = ["gi.*"]
ignore_missing_imports = true
