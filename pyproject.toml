[project]
name = "mixtape"
version = "0.7.0.dev0"
description = "Gstreamer python application mini-framework"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Ashley Camba Garrido", email = "ashwoods@gmail.com" }]
# PyGObject (`gi`) and GStreamer come from the system (Homebrew or apt), see README.
requires-python = ">=3.12"
dependencies = ["pydantic>=2.11"]  # serialize_by_alias
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]

[project.optional-dependencies]
# No `uvicorn[standard]`: its uvloop and httptools are C extensions, and the server runs on
# asyncio next to the player anyway.
http = [
    "fastapi>=0.115",
    "uvicorn>=0.29",  # Server.capture_signals
    "websockets>=13",
]

[project.scripts]
mixtape = "mixtape.cli:main"

[project.entry-points."mixtape.features"]
leaks = "mixtape.features.leaks:Leaks"
stats = "mixtape.features.stats:Stats"
tracers = "mixtape.features.tracers:Tracers"

[project.urls]
Homepage = "https://github.com/ashwoods/mixtape"

[dependency-groups]
dev = [
    "colorlog",
    "httpx",
    "mixtape[http]",
    "mypy",
    "pytest",
    "pytest-asyncio",
    "pytest-mock",
    "pytest-timeout",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mixtape"]

[tool.uv]
required-version = ">=0.8"

[tool.pytest.ini_options]
addopts = "-ra --tb=short"
testpaths = ["tests"]
timeout = 20
timeout_method = "thread"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "B", "N"]
ignore = [
    "E402", # gi.require_version() must run before `from gi.repository import ...`
    "N818", # renaming the public exceptions is an API change
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["N803"] # the `Gst` fixture mirrors the module name

[tool.mypy]
files = ["mixtape", "tests"]
python_version = "3.12"
strict_optional = true
strict_equality = true
warn_no_return = true
warn_redundant_casts = true
warn_unused_configs = true
warn_unused_ignores = true
disallow_any_generics = true
disallow_incomplete_defs = true
disallow_subclassing_any = true
disallow_untyped_decorators = true
disallow_untyped_defs = true
check_untyped_defs = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = ["gi.*"]
ignore_missing_imports = true
